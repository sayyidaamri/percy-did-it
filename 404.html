 sodas lost the plot?", "case-files/have-sodas-lost-the-plot.html", "article Somewhere along the way soda became a chemistry set. Colors that glow, sweeteners with three-part names, fruit on the label and none in the can. We lined up the usual suspects and asked them to explain."], ["Unboxed: a cozy kind of trouble", "case-files/unboxed-a-cozy-kind-of-trouble.html", "article The four-pack showed up on a snow day and did not make it to lunch. Here is our very serious tasting log, recorded under a blanket."], ["Eleven low-sugar sips, ranked by a very tired dietitian", "case-files/eleven-low-sugar-sips.html", "article We asked a dietitian friend to rank the sparkling shelf at her corner store. She said yes, then asked for a chair."], ["Meet the jumbo fizz", "case-files/meet-the-jumbo-fizz.html", "article Bubble size matters. Small bubbles feel creamy, big ones feel loud. We turned ours up until the test kitchen got a noise complaint, then backed off half a notch."], ["Stock up: three things for the fridge", "case-files/stock-up-three-things-for-the-fridge.html", "article A good fridge is an alibi. If anyone asks where you were, you were home, you were fine, and you had snacks."], ["Percy did it, hits the party", "case-files/percy-did-it-hits-the-party.html", "article We launched the full line at a warehouse party with a string quartet, a smoke machine and exactly one rule: no plain water in the good glasses."], ["Behind the bubbles: inside the flavor lab", "case-files/behind-the-bubbles.html", "article The lab is a converted boathouse with nine fridges and a rule against talking before the first tasting. Every flavor starts as a smell on a paper strip."], ["The great fridge heist", "case-files/the-great-fridge-heist.html", "article It was 11:40 on a Tuesday. The office fridge had twelve cans in it. By 11:55 it had none, and everyone was very busy at their desks."]]</script>
